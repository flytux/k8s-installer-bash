
#cloud-config
hostname: node-02.local
fqdn: node-02.local

users:
  # whatever username you like
  - name: jaehoon
    # so our user can just sudo without any password
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    # content from /root/.ssh/id_rsa.pub on your host system
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDK/icch8u573Dwex9QRwVtLMAtNILVMBaevt+JFQlWP root@kw01-local
  - name: root
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDK/icch8u573Dwex9QRwVtLMAtNILVMBaevt+JFQlWP root@kw01-local
ssh_pwauth: true
disable_root: false
chpasswd:
  list: |
    jaehoon:1
    root:root
  expire: False

runcmd:
  - echo nameserver 8.8.8.8  > /etc/resolv.conf
  - mkdir -p /etc/NetworkManager/conf.d/
  - echo -e "[main] \ndns=none" > /etc/NetworkManager/conf.d/90-dns-none.conf
  - systemctl reload NetworkNanager

